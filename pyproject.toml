[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tokenizer-tax"
version = "0.1.0"
description = "How many more tokens does French cost than English, per LLM tokenizer?"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pandas",
  "pyarrow",
  "tiktoken",
  "tokenizers",
  "huggingface_hub",
  "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
